{% set name = "urbansim" %}
{% set version = "3.3" %}
{% set sha256 = "4c1f0bd0d44ed8604afa812cd103ef4188ad0b921ca6864482e48ed9528c974d" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}


build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.8.0
    - orca >=1.1
    - pandas >=0.17.0
    - patsy >=0.4.1
    - prettytable >=0.7.2
    - pyyaml >=3.10
    - scipy >=1.0
    - statsmodels >=0.8
    - toolz >=0.8.1

test:
  requires:
    - python {{ python_min }}
  imports:
    - urbansim
    - urbansim.developer
    - urbansim.maps
    - urbansim.models
    - urbansim.urbanchoice
    - urbansim.utils

about:
  home: https://github.com/udst/urbansim
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: 'Platform for building statistical models of cities and regions'
  doc_url: https://udst.github.io/urbansim/
  dev_url: https://github.com/udst/urbansim

extra:
  recipe-maintainers:
    - waddell
    - smmaurer
